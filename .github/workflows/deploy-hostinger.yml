name: Build and Deploy to Hostinger (FTP)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Show build output
        run: ls -la dist

      - name: Validate FTP settings
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ secrets.HOSTINGER_FTP_PROTOCOL }}
          FTP_PORT: ${{ secrets.HOSTINGER_FTP_PORT }}
        run: |
          test -n "$FTP_HOST" || (echo "HOSTINGER_FTP_HOST is empty" && exit 1)
          test -n "$FTP_USERNAME" || (echo "HOSTINGER_FTP_USERNAME is empty" && exit 1)
          test -n "$FTP_PASSWORD" || (echo "HOSTINGER_FTP_PASSWORD is empty" && exit 1)
          case "$FTP_HOST" in
            ftp://*|ftps://*|sftp://*|http://*|https://*)
              echo "HOSTINGER_FTP_HOST must be hostname only, without protocol"
              exit 1
              ;;
          esac
          echo "FTP settings look present. Protocol=${FTP_PROTOCOL:-unset} Port=${FTP_PORT:-unset}"

      - name: Deploy dist to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: /public_html/
          local-dir: dist/
          protocol: ${{ secrets.HOSTINGER_FTP_PROTOCOL }}
          port: ${{ secrets.HOSTINGER_FTP_PORT }}

      - name: Confirm deploy target
        run: echo "Deployed dist/ to /public_html/ on ${{ secrets.HOSTINGER_FTP_HOST }}"
