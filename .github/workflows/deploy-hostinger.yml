name: Build and Deploy to Hostinger (FTP)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Explain deployment target
        run: |
          echo "Building the app and uploading dist/ to Hostinger via FTP."
          echo "This deploy updates the frontend assets served from public_html."
          echo "If your Hostinger setup runs the Node backend separately, it must be deployed there too."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Show build output
        run: ls -la dist

      - name: Normalize FTP settings
        id: ftp
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ secrets.HOSTINGER_FTP_PROTOCOL }}
          FTP_PORT: ${{ secrets.HOSTINGER_FTP_PORT }}
        run: |
          test -n "$FTP_HOST" || (echo "HOSTINGER_FTP_HOST is empty" && exit 1)
          test -n "$FTP_USERNAME" || (echo "HOSTINGER_FTP_USERNAME is empty" && exit 1)
          test -n "$FTP_PASSWORD" || (echo "HOSTINGER_FTP_PASSWORD is empty" && exit 1)
          SANITIZED_HOST="$FTP_HOST"
          SANITIZED_HOST="${SANITIZED_HOST#ftp://}"
          SANITIZED_HOST="${SANITIZED_HOST#ftps://}"
          SANITIZED_HOST="${SANITIZED_HOST#sftp://}"
          SANITIZED_HOST="${SANITIZED_HOST#http://}"
          SANITIZED_HOST="${SANITIZED_HOST#https://}"
          SANITIZED_HOST="${SANITIZED_HOST%/}"
          test -n "$SANITIZED_HOST" || (echo "HOSTINGER_FTP_HOST is invalid after normalization" && exit 1)
          echo "server=$SANITIZED_HOST" >> "$GITHUB_OUTPUT"
          echo "protocol=${FTP_PROTOCOL:-ftp}" >> "$GITHUB_OUTPUT"
          echo "port=${FTP_PORT:-21}" >> "$GITHUB_OUTPUT"
          echo "Normalized FTP settings prepared. Protocol=${FTP_PROTOCOL:-ftp} Port=${FTP_PORT:-21}"

      - name: Deploy dist to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ steps.ftp.outputs.server }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: /public_html/
          local-dir: dist/
          protocol: ${{ steps.ftp.outputs.protocol }}
          port: ${{ steps.ftp.outputs.port }}

      - name: Confirm deploy target
        run: echo "Deployed dist/ to /public_html/ on ${{ steps.ftp.outputs.server }}"
